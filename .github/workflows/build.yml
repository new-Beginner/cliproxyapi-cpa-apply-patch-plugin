name: Build & Release Plugin

on:
  push:
    branches: [ "main", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]
  release:
    types: [ published ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build Windows DLL
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "1"
          go mod tidy
          go build -buildmode=c-shared -ldflags="-s -w" -o apply_patch.dll .
          if (Test-Path apply_patch.h) { Remove-Item apply_patch.h -Force }

          $tag = "${{ github.ref_name }}"
          $ver = if ($tag -match '^v?([0-9]+\.[0-9]+\.[0-9]+.*)$') { $matches[1] } else { "1.2.0" }
          $zipName = "apply_patch_${ver}_windows_amd64.zip"

          Compress-Archive -Path apply_patch.dll -DestinationPath $zipName -Force
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName`n" | Out-File -FilePath checksums.txt -Encoding ascii

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apply_patch-windows-amd64
          path: apply_patch.dll

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release'
        with:
          files: |
            apply_patch.dll
            apply_patch_*_windows_amd64.zip
            checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
